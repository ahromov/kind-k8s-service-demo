apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-service

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0

  selector:
    matchLabels:
      app: my-service

  template:
    metadata:
      labels:
        app: my-service

    spec:
      automountServiceAccountToken: false

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: my-service

      containers:
        - name: my-service
          image: my-service:1.0
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi

          ports:
            - name: http
              containerPort: 8080
            - name: actuator
              containerPort: 8081

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=20"

          envFrom:
            - configMapRef:
                name: my-service-db-config
            - secretRef:
                name: my-service-db-secret

          startupProbe:
            tcpSocket:
              port: actuator
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 36
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
